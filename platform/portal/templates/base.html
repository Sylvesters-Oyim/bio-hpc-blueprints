<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Cluster Portal{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>"></head><body>
<header><nav><a class="brand" href="/">🧬 Lab Cluster</a>
{% set p = request.path %}
<a class="tab {{ 'on' if p == '/' }}" href="/">Cluster</a>
<a class="tab {{ 'on' if p.startswith('/new') }}" href="/new">New job</a>
<a class="tab {{ 'on' if p.startswith('/jobs') }}" href="/jobs">My jobs</a>
<a class="tab" href="/learn">Cluster 101</a>
<a class="tab" href="/static/pbs101.html">PBS for CHPC</a>
<a class="tab" style="margin-left:auto;opacity:.75" href="https://sylvesters-oyim.github.io/" target="_blank" rel="noopener">sylvesters-oyim.github.io</a>
{% if user %}<span class="who" style="margin-left:18px">{{ user }} · <a href="/logout">log out</a></span>{% endif %}
</nav></header><main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}</main></body></html>
