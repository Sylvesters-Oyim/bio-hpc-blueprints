# BioLab cluster inventory.
# Controller = runs slurmctld (the head node). All hosts run slurmd (are compute nodes).
# To ADD a node later: add one line under [compute] with its addr + specs. That's it.
# GPU node example is shown commented at the bottom.
#
# Author: Sylvesters Ochieng Oyim, Rhodes University

[controller]
jaguar ansible_connection=local node_addr=100.71.55.41 slurm_cpus=20 slurm_realmem=13000

[compute]
lynx   ansible_host=100.121.100.74 node_addr=100.121.100.74 slurm_cpus=20 slurm_realmem=12000
# puma ansible_host=100.x.y.z node_addr=100.x.y.z slurm_cpus=32 slurm_realmem=60000 slurm_gres=gpu:1

[cluster:children]
controller
compute

[cluster:vars]
ansible_user=clusteradmin
