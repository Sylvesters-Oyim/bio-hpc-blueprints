---
# Master playbook. Run role-by-role using --tags so you can VERIFY at each checkpoint.
#   ansible-playbook site.yml --tags safety     # create break-glass admin (lockout insurance)
#   ansible-playbook site.yml --tags uid        # align clusteradmin UID (the one risky step)
#   ansible-playbook site.yml --tags munge      # shared-secret auth for Slurm
#   ansible-playbook site.yml --tags slurm      # build + configure + start Slurm
# Or everything at once (only after you trust it): ansible-playbook site.yml
#
# Author: Sylvesters Ochieng Oyim, Rhodes University
- name: BioLab cluster foundation
  hosts: cluster
  gather_facts: true
  roles:
    - { role: uid_align, tags: ['safety', 'uid'] }
    - { role: munge,     tags: ['munge'] }
    - { role: slurm,     tags: ['slurm'] }
