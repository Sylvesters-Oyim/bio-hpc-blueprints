# One line per machine (Penguins of Madagascar: Skipper leads, Kowalski computes, Rico is a future GPU node).
# node_addr = the IP nodes use to reach each other (LAN or VPN, e.g. Tailscale).
# cpus / realmem: run `slurmd -C` on the node and copy its CPUs and RealMemory (leave ~1 GB spare).

[controller]
skipper ansible_connection=local node_addr=100.64.0.1 slurm_cpus=20 slurm_realmem=13000

[compute]
kowalski ansible_host=100.64.0.2 node_addr=100.64.0.2 slurm_cpus=20 slurm_realmem=12000
# rico ansible_host=100.64.0.3 node_addr=100.64.0.3 slurm_cpus=32 slurm_realmem=60000 slurm_gres=gpu:1

[cluster:children]
controller
compute

[cluster:vars]
ansible_user=clusteradmin
