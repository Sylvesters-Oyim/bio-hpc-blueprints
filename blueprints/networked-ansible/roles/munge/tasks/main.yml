---
# Slurm daemons prove who they are with munge. Every node needs the SAME key.
- name: Install munge
  ansible.builtin.apt:
    name: [munge, libmunge-dev]
    update_cache: true

- name: Create key on the controller (once)
  ansible.builtin.shell: dd if=/dev/urandom bs=1 count=1024 of=/etc/munge/munge.key && chmod 400 /etc/munge/munge.key && chown munge:munge /etc/munge/munge.key
  args:
    creates: /etc/munge/munge.key
  when: inventory_hostname == control_machine

- name: Read the controller's key
  ansible.builtin.slurp:
    src: /etc/munge/munge.key
  register: munge_key
  run_once: true
  delegate_to: "{{ control_machine }}"

- name: Copy the same key to every node
  ansible.builtin.copy:
    content: "{{ munge_key.content | b64decode }}"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  notify: restart munge

- name: Start munge
  ansible.builtin.systemd:
    name: munge
    enabled: true
    state: started
