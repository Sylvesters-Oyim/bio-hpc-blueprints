---
# Aligns clusteradmin's UID/GID to the cluster-wide target, WITH a break-glass safety net.
# The 'safety' tagged tasks create a second way in FIRST, so a bad UID change can't lock you out.
#
# Author: Sylvesters Ochieng Oyim, Rhodes University

# ---------- SAFETY NET (tag: safety) ----------
- name: (safety) Create break-glass admin user 'biolabadmin'
  ansible.builtin.user:
    name: biolabadmin
    uid: 1500
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
  tags: ['safety']

- name: (safety) Passwordless sudo for break-glass admin
  ansible.builtin.copy:
    dest: /etc/sudoers.d/91-biolabadmin
    content: "biolabadmin ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"
  tags: ['safety']

- name: (safety) Give break-glass admin the SAME working SSH key clusteradmin already uses
  ansible.builtin.copy:
    src: "/home/clusteradmin/.ssh/authorized_keys"
    remote_src: true
    dest: "/home/biolabadmin/.ssh/authorized_keys"
    owner: biolabadmin
    group: biolabadmin
    mode: "0600"
  tags: ['safety']

- name: (safety) Ensure break-glass .ssh dir perms
  ansible.builtin.file:
    path: /home/biolabadmin/.ssh
    state: directory
    owner: biolabadmin
    group: biolabadmin
    mode: "0700"
  tags: ['safety']

# ---------- UID ALIGN (tag: uid) ----------
- name: (uid) Read current clusteradmin UID
  ansible.builtin.command: id -u clusteradmin
  register: cur_uid
  changed_when: false
  tags: ['uid']

- name: (uid) Change clusteradmin group GID -> target
  ansible.builtin.command: "groupmod -g {{ target_admin_gid }} clusteradmin"
  when: cur_uid.stdout != target_admin_uid | string
  tags: ['uid']

- name: (uid) Change clusteradmin UID -> target (also re-stamps home dir automatically)
  ansible.builtin.command: "usermod -u {{ target_admin_uid }} clusteradmin"
  when: cur_uid.stdout != target_admin_uid | string
  tags: ['uid']

- name: (uid) Re-stamp any stray files on THIS filesystem still owned by the old UID
  ansible.builtin.shell: >
    find / -xdev \( -path /proc -o -path /sys -o -path /srv/biolab/shared \) -prune -o
    -uid {{ cur_uid.stdout }} -exec chown {{ target_admin_uid }}:{{ target_admin_gid }} {} +
  when: cur_uid.stdout != target_admin_uid | string
  changed_when: true
  tags: ['uid']

- name: (uid) Verify new UID
  ansible.builtin.command: id clusteradmin
  register: new_id
  changed_when: false
  tags: ['uid']

- name: (uid) Show result
  ansible.builtin.debug:
    msg: "clusteradmin on {{ inventory_hostname }} is now: {{ new_id.stdout }}"
  tags: ['uid']
