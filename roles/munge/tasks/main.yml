---
# Munge = the shared-secret auth Slurm uses so daemons trust each other.
# Requirement: the SAME /etc/munge/munge.key on every node. (The munge-user UID need NOT match.)
#
# Author: Sylvesters Ochieng Oyim, Rhodes University

- name: Install munge
  ansible.builtin.apt:
    name: [munge, libmunge-dev]
    state: present
    update_cache: true

- name: Generate the munge key on the controller (only if missing)
  ansible.builtin.command: "dd if=/dev/urandom bs=1 count=1024 of=/etc/munge/munge.key"
  args:
    creates: /etc/munge/munge.key
  when: inventory_hostname == control_machine

- name: Fix munge key ownership/permissions on controller
  ansible.builtin.file:
    path: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  when: inventory_hostname == control_machine

- name: Read the controller's munge key into a variable
  ansible.builtin.slurp:
    src: /etc/munge/munge.key
  register: munge_key_b64
  run_once: true
  delegate_to: "{{ control_machine }}"

- name: Distribute the identical munge key to every node
  ansible.builtin.copy:
    content: "{{ munge_key_b64.content | b64decode }}"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  notify: restart munge

- name: Enable and start munge
  ansible.builtin.systemd:
    name: munge
    enabled: true
    state: started
